[mypy]
python_version = 3.12
files = backend, dashboard, shared, scripts, tests
exclude = (?x)(
    ^venv/
    | ^\.mypy_cache/
    | ^\.pytest_cache/
    | ^\.ruff_cache/
    )
pretty = True
show_error_codes = True
warn_unused_configs = True
follow_imports = normal
check_untyped_defs = True
warn_return_any = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
warn_unreachable = True

[mypy-altair.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-librouteros.*]
ignore_missing_imports = True

[mypy-ping3.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pysnmp.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-telegram.*]
ignore_missing_imports = True

[mypy-greenlet.*]
ignore_missing_imports = True

[mypy-components.*]
ignore_missing_imports = True

[mypy-backend.app.core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
disallow_any_generics = True

[mypy-backend.app.services.auth.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True

[mypy-backend.app.alerting.engine_parts.evaluation_context]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True

[mypy-backend.app.alerting.engine_parts.device_evaluators]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True

[mypy-backend.app.alerting.engine_parts.rule_evaluators]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True

[mypy-backend.app.alerting.engine_parts.utils]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True

[mypy-backend.app.monitors.internet.service]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
