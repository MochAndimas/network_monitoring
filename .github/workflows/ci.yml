name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  schedule:
    - cron: "15 0 * * 1"

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:///./ci_tests.db
      INTERNAL_API_KEY: ci-internal-key
      AUTH_PASSWORD_SECRET: ci-password-secret
      AUTH_JWT_SECRET: ci-jwt-secret
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/backend.txt
            requirements/dev.txt
            requirements/security.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Pre-commit hygiene hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check installed dependencies
        run: make dependency-check

      - name: Check Python formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Lint (quality-gate staged rules)
        run: make lint-staged

      - name: Type Check (mypy staged scope)
        run: mypy --config-file mypy.ini

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type Check (pyright staged scope)
        run: pyright

      - name: Unit and API tests
        run: make test

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm lint
      - name: Typecheck frontend
        run: pnpm typecheck
      - name: Test frontend
        run: pnpm test
      - name: Build frontend with explicit API URL
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test
      - name: Audit frontend dependencies
        run: pnpm audit --prod

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV_FILE: ""
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:///./ci_e2e.db
      DATABASE_AUTO_CREATE_TABLES: "true"
      INTERNAL_API_KEY: ci-internal-key
      AUTH_PASSWORD_SECRET: ci-password-secret
      AUTH_JWT_SECRET: ci-jwt-secret
      CORS_ORIGINS: http://127.0.0.1:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-fixture-password
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_USERNAME: ci-admin
      E2E_PASSWORD: ci-admin-fixture-password
      E2E_ALLOW_MUTATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install fixture and browser dependencies
        run: |
          python -m pip install -r requirements/backend.txt
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build
      - name: Start isolated fixture services
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > backend-e2e.log 2>&1 &
          (cd frontend && pnpm start --hostname 127.0.0.1) > frontend-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-e2e.log frontend-e2e.log
          exit 1
      - name: Run functional E2E suite
        working-directory: frontend
        run: pnpm test:e2e --grep-invert "desktop visual regression"
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
            frontend-e2e.log

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: network_monitoring_ci
          MYSQL_USER: network_monitoring
          MYSQL_PASSWORD: network_monitoring
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -unetwork_monitoring -pnetwork_monitoring --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    env:
      DATABASE_URL: mysql+pymysql://network_monitoring:network_monitoring@127.0.0.1:3306/network_monitoring_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/backend.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/backend.txt
          pip install pytest==9.0.3

      - name: Run Alembic upgrade
        run: alembic upgrade head

      - name: Verify a single Alembic head
        run: |
          head_count="$(alembic heads | grep -c '(head)' || true)"
          test "$head_count" -eq 1

      - name: Verify database schema has no model drift
        run: alembic check

      - name: Verify latest migration can roll back and re-apply
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Run MySQL integration tests
        run: pytest tests/services/test_mysql_integration.py -q

  non-functional-smoke:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:///./ci_nonfunctional.db
      INTERNAL_API_KEY: ci-internal-key
      AUTH_PASSWORD_SECRET: ci-password-secret
      AUTH_JWT_SECRET: ci-jwt-secret
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
      LOG_LEVEL: INFO
      DATABASE_AUTO_CREATE_TABLES: "true"
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-fixture-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/backend.txt
            requirements/dev.txt
            requirements/security.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Start backend for smoke checks
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat uvicorn.log
          exit 1

      - name: Benchmark regression gate
        id: benchmark_gate
        continue-on-error: true
        run: |
          mkdir -p .ci_artifacts
          python - <<'PY'
          import os
          import subprocess
          import sys
          import httpx

          response = httpx.post("http://127.0.0.1:8000/auth/login", json={
              "username": os.environ["BOOTSTRAP_ADMIN_USERNAME"],
              "password": os.environ["BOOTSTRAP_ADMIN_PASSWORD"],
          })
          response.raise_for_status()
          subprocess.run([
              sys.executable, "scripts/benchmark_endpoints.py",
              "--base-url", "http://127.0.0.1:8000", "--profile", "ci", "--runs", "3",
              "--output-json", ".ci_artifacts/benchmark.json",
          ], env={**os.environ, "BENCHMARK_BEARER_TOKEN": response.json()["access_token"]}, check=True)
          PY

      - name: Concurrency smoke test
        id: concurrency_gate
        continue-on-error: true
        run: |
          python scripts/concurrency_smoke.py \
            --base-url http://127.0.0.1:8000 \
            --api-key ci-internal-key \
            --profile ci \
            --requests 10 \
            --concurrency 5 \
            --output-json .ci_artifacts/concurrency.json

      - name: Concurrency failure scenario (expected failure path)
        id: concurrency_expected_failure
        continue-on-error: true
        run: |
          if python scripts/concurrency_smoke.py \
            --base-url http://127.0.0.1:8000 \
            --api-key ci-internal-key \
            --profile custom \
            --path /health/live \
            --requests 5 \
            --concurrency 2 \
            --max-p95-ms 0.01 \
            --max-max-ms 0.01; then
            echo "Expected concurrency smoke to fail with impossible thresholds."
            exit 1
          fi

      - name: Observability payload smoke test
        id: observability_gate
        continue-on-error: true
        run: |
          python scripts/observability_payload_smoke.py \
            --base-url http://127.0.0.1:8000 \
            --api-key ci-internal-key \
            --output-json .ci_artifacts/observability_payload.json

      - name: Build non-functional triage + SLA artifacts
        if: always()
        run: |
          python scripts/nonfunctional_report.py \
            --artifacts-dir .ci_artifacts \
            --triage-output .ci_artifacts/nonfunctional_triage.md \
            --sla-output .ci_artifacts/weekly_sla_baseline.md \
            --sla-json-output .ci_artifacts/weekly_sla_baseline.json

      - name: Publish non-functional triage summary
        if: always()
        run: cat .ci_artifacts/nonfunctional_triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish weekly SLA baseline summary
        if: always()
        run: cat .ci_artifacts/weekly_sla_baseline.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-functional artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-functional-smoke-artifacts
          path: |
            .ci_artifacts/*.json
            .ci_artifacts/*.md
            uvicorn.log

      - name: Enforce non-functional quality gates
        if: always()
        run: |
          failures=0
          if [ "${{ steps.benchmark_gate.outcome }}" != "success" ]; then
            echo "Benchmark regression gate failed."
            failures=1
          fi
          if [ "${{ steps.concurrency_gate.outcome }}" != "success" ]; then
            echo "Concurrency smoke gate failed."
            failures=1
          fi
          if [ "${{ steps.concurrency_expected_failure.outcome }}" != "success" ]; then
            echo "Expected-failure scenario gate failed."
            failures=1
          fi
          if [ "${{ steps.observability_gate.outcome }}" != "success" ]; then
            echo "Observability payload smoke gate failed."
            failures=1
          fi
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t network-monitoring-backend-ci .

      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.example.test -f frontend/Dockerfile -t network-monitoring-frontend-ci frontend

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/backend.txt
            requirements/security.txt

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/security.txt

      - name: Verify audit tooling startup
        run: |
          python -m pip check
          semgrep --version

      - name: Audit backend dependencies
        run: make security-dependencies

      - name: Bandit SAST (backend, scripts)
        if: ${{ !cancelled() }}
        run: make security-bandit

      - name: Semgrep SAST (staged security rules)
        if: ${{ !cancelled() }}
        run: make security-semgrep

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
