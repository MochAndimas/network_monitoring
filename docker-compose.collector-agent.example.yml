# Deploy this file on a server inside one site, connected to central MySQL via VPN.
# It exposes no ports and polls only the configured local site.
services:
  collector-agent:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Network Monitoring Agent}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to central MySQL over VPN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COLLECTOR_AGENT_SITE: ${COLLECTOR_AGENT_SITE:?Set the exact local site name}
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_DEVICE_SECONDS: ${SCHEDULER_INTERVAL_DEVICE_SECONDS:-60}
      SCHEDULER_JOB_MAX_INSTANCES: "1"
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Jakarta}
      MONITORING_LOCK_NAME: ${MONITORING_LOCK_NAME:-network_monitoring.pipeline}
      MONITORING_LOCK_TIMEOUT_SECONDS: ${MONITORING_LOCK_TIMEOUT_SECONDS:-900}
      PING_TIMEOUT_SECONDS: ${PING_TIMEOUT_SECONDS:-2}
      PING_SAMPLE_COUNT: ${PING_SAMPLE_COUNT:-3}
      PING_CONCURRENCY_LIMIT: ${PING_CONCURRENCY_LIMIT:-16}
      MONITOR_TASK_CONCURRENCY_LIMIT: ${MONITOR_TASK_CONCURRENCY_LIMIT:-8}
      SNMP_CONCURRENCY_LIMIT: ${SNMP_CONCURRENCY_LIMIT:-4}
      COLLECTOR_RETRY_ATTEMPTS: ${COLLECTOR_RETRY_ATTEMPTS:-2}
      COLLECTOR_RETRY_BACKOFF_SECONDS: ${COLLECTOR_RETRY_BACKOFF_SECONDS:-0.25}
      PRINTER_SNMP_COMMUNITIES: ${PRINTER_SNMP_COMMUNITIES:-}
      NAS_SNMP_COMMUNITIES: ${NAS_SNMP_COMMUNITIES:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      AUTH_PASSWORD_SECRET: ${AUTH_PASSWORD_SECRET:?AUTH_PASSWORD_SECRET must be set}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_PASSWORD_MIN_LENGTH: ${AUTH_PASSWORD_MIN_LENGTH:-12}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME must be set}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost}
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    command: ["sh", "-c", "python -m backend.app.scheduler.worker"]
